# Claude review. Runs this repo's own review rubric (.claude/agents/code-reviewer.md)
# against the PR diff and posts the review as a PR comment. It never writes to the
# branch (contents: read); it does write comments (pull-requests, issues).
#
# Fires on demand when a trusted contributor comments `@claude-review`.
#
# The automatic pull_request trigger stays disabled while the secret below is
# unset — enabled, it would fail on every PR. Restore the two commented lines once
# the secret exists; the job's `if:` keeps its pull_request branch for that.
#
# Requires the CLAUDE_CODE_OAUTH_TOKEN repository secret, and fails without it.
name: Claude Review

on:
  # pull_request:
  #   types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # Job-level, not workflow-level: every PR comment starts this workflow, and
    # a workflow-level group would let an unrelated comment cancel a live review.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    if: |
      github.event_name == 'pull_request' || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && contains(github.event.comment.body, '@claude-review')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read         # read-only — the reviewer never edits the branch
      pull-requests: write   # post the review as a comment
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run the review contract
        uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude-review"
          track_progress: true
          prompt: |
            Read AGENTS.md at the repository root, then read
            .claude/agents/code-reviewer.md and follow that rubric for this pull
            request, with the .claude/rules/*.md files whose globs match the
            changed paths (index: .claude/rules/README.md). AGENTS.md is the
            single source of truth for this repo's rules — CLAUDE.md is only an
            adapter. Never read anything under .legacy-assets/.

            Two adjustments for CI:
            - Post your findings as a SINGLE pull-request comment. Do not submit
              a formal approve or request-changes review; a human does that.
            - Do not modify any files. This is a read-only review.

            The only gate is `python3 check.py --run` (standard library, no
            install). There is no build, no npm, no linter and no test framework
            in this project — do not run or suggest them, and do not report their
            absence as a finding.
          claude_args: |
            --max-turns 20
