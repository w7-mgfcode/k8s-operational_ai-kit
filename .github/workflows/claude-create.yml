# Claude hybrid trust pattern — the agent does the implementation, a human keeps
# the merge. Comment `@claude` on an issue or PR (or open an issue whose body says
# `@claude`) and Claude implements the change and opens a draft PR. The last step
# is intentionally not the agent's.
#
# Requires the CLAUDE_CODE_OAUTH_TOKEN repository secret, and fails without it.
# There is nothing to install: check.py is standard library only.
name: Claude Create

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

# Only trusted contributors can invoke the agent. author_association is
# OWNER / MEMBER / COLLABORATOR for people with write access — forks and
# drive-by commenters are CONTRIBUTOR or NONE and cannot trigger a run.
# `@claude-review` belongs to claude-review.yml; without the exclusion, every
# review request would also start an implementation run here.
jobs:
  claude-create:
    if: |
      (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
        && contains(github.event.comment.body, '@claude')
        && !contains(github.event.comment.body, '@claude-review')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'issues'
        && contains(github.event.issue.body, '@claude')
        && !contains(github.event.issue.body, '@claude-review')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # create branches, push commits
      pull-requests: write   # open and update PRs
      issues: write          # comment back on the issue
      id-token: write        # OIDC auth for the Claude action
      actions: read          # read CI results for context

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          track_progress: true
          prompt: |
            Implement the change requested in this issue or PR comment.

            Work in this order:
            1. Read AGENTS.md at the repository root before changing anything. It
               is the single source of truth for this repo's rules; CLAUDE.md is
               only an adapter. Then read the `.claude/rules/*.md` whose `paths:`
               glob matches the files you are about to touch (index:
               .claude/rules/README.md).
            2. Implement the smallest correct change that satisfies the request.
            3. Run `python3 check.py --run` and fix what fails. It must exit 0 and
               leave `git status` clean.
            4. Commit on the working branch the action checked out, with a
               Conventional Commit message per .claude/rules/git-workflow.md and a
               `Context:` trailer if you touched agent-context assets, push it, and
               open a DRAFT pull request with `gh pr create --draft`.

            Non-negotiables for this repository:
            - The repository is public. Never create or stage anything under `.legacy-assets/`
              and never write an organization name, hostname, internal domain, IP
              or credential into any file.
            - Skeletons are Python standard library only. Never add a dependency,
              a build system, a linter or a test framework.
            - AGENTS.md § Safety lists the stop-and-ask gates: deleting or
              rewriting a card, changing a card's `maturity`, editing
              `.claude/rules/`. You cannot ask here, so do not do them — comment
              on the issue explaining what you would change instead.

            Stop at the draft PR. A human reviews and merges — that final step
            is intentionally not yours.
          # Bash is disabled by default in the action. Tag mode (forced by
          # track_progress) already grants git add/commit/push; these are the only
          # other commands the prompt needs — the gate, read-only git, the draft PR.
          claude_args: |
            --max-turns 30
            --allowedTools "Bash(python3 check.py:*),Bash(git status:*),Bash(git diff:*),Bash(gh pr create:*)"
